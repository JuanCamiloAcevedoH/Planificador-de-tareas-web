
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planificador de Tareas</title>
  
  <!-- CDN Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- CDN Bootstrap Icons (para los checkboxes/iconos) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- CSS Personalizado -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">

  <div class="container my-4">
    
    <!-- [ HEADER - Planificador de Tareas ] -->
    <header class="row mb-4">
      <div class="col-12">
        <div class="p-4 bg-white rounded shadow-sm border text-center">
          <h1 class="h3 m-0 fw-bold text-primary">
            <i class="bi bi-journal-check me-2"></i>Planificador de Tareas
          </h1>
        </div>
      </div>
    </header>

    <!-- CONTENIDO PRINCIPAL: FORMULARIO Y LISTA -->
    <main class="row g-4">
      
      <!-- [ FORMULARIO ] -->
      <section class="col-12 col-md-5">
        <div class="card shadow-sm border-0 h-100">
          <div class="card-body p-4">
            <h2 class="h5 card-title mb-3 border-bottom pb-2">Agregar Tarea</h2>
            
            <form id="form-tarea">
              <!-- Nombre / Título -->
              <div class="mb-3">
                <label for="tituloTarea" class="form-label">Título de la tarea</label>
                <input type="text" class="form-control" id="tituloTarea" placeholder="Ej. Estudiar Bootstrap" required>
              </div>

              <!-- Descripción / Detalle -->
              <div class="mb-3">
                <label for="descripcionTarea" class="form-label">Descripción</label>
                <textarea class="form-control" id="descripcionTarea" rows="3" placeholder="Detalles sobre la tarea..."></textarea>
              </div>

              <!-- Fecha / Prioridad (opcional) -->
              <div class="mb-3">
                <label for="fechaTarea" class="form-label">Fecha límite</label>
                <input type="date" class="form-control" id="fechaTarea">
              </div>

              <!-- Botón Agregar Tarea -->
              <button type="submit" class="btn btn-primary w-100 d-flex align-items-center justify-content-center gap-2">
                <i class="bi bi-plus-circle"></i> + Agregar tarea
              </button>
            </form>

          </div>
        </div>
      </section>

      <!-- [ LISTA DE TAREAS ] -->
      <section class="col-12 col-md-7">
        <div class="card shadow-sm border-0 h-100">
          <div class="card-body p-4">
            <h2 class="h5 card-title mb-3 border-bottom pb-2">Lista de Tareas</h2>
            
            <ul class="list-group list-group-flush" id="lista-tareas">
              
              <!-- Tarea 1 de Ejemplo -->
              <li class="list-group-item d-flex align-items-center justify-content-between p-3 mb-2 rounded bg-body-tertiary border">
                <div class="form-check d-flex align-items-center gap-2">
                  <input class="form-check-input mt-0 fs-5" type="checkbox" value="" id="tarea1">
                  <label class="form-check-label mb-0" for="tarea1">
                    <strong>Diseñar wireframe en Figma</strong>
                    <span class="d-block text-muted small">Completar la maquetación inicial</span>
                  </label>
                </div>
                <span class="badge bg-warning text-dark">Pendiente</span>
              </li>

              <!-- Tarea 2 de Ejemplo -->
              <li class="list-group-item d-flex align-items-center justify-content-between p-3 mb-2 rounded bg-body-tertiary border">
                <div class="form-check d-flex align-items-center gap-2">
                  <input class="form-check-input mt-0 fs-5" type="checkbox" value="" id="tarea2">
                  <label class="form-check-label mb-0" for="tarea2">
                    <strong>Conectar Bootstrap 5</strong>
                    <span class="d-block text-muted small">Añadir CDNs al HTML</span>
                  </label>
                </div>
                <span class="badge bg-warning text-dark">Pendiente</span>
              </li>

              <!-- Tarea 3 de Ejemplo -->
              <li class="list-group-item d-flex align-items-center justify-content-between p-3 mb-2 rounded bg-body-tertiary border">
                <div class="form-check d-flex align-items-center gap-2">
                  <input class="form-check-input mt-0 fs-5" type="checkbox" value="" id="tarea3" checked>
                  <label class="form-check-label mb-0 text-decoration-line-through text-muted" for="tarea3">
                    <strong>Crear repositorio en GitHub</strong>
                    <span class="d-block text-muted small">Subir proyecto inicial</span>
                  </label>
                </div>
                <span class="badge bg-success">Completada</span>
              </li>

            </ul>

          </div>
        </div>
      </section>

    </main>

  </div>

  <!-- CDN Bootstrap JS Bundle con Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
