<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planificador de Tareas</title>
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="container-fluid px-4 py-4">
    <h1 class="mb-4 text-center fw-bold text-white">🌎 Planificador de Tareas</h1>

    <!-- Contenedor Principal a dos columnas -->
    <div class="row g-4">

      <!-- Columna Izquierda: Formulario Fijo -->
      <div class="col-lg-5 col-xl-4">
        <div class="card card-custom p-4 sticky-top" style="top: 20px;">
          <h3 class="card-title mb-3 fs-4 text-white fw-semibold">Agregar Tarea</h3>
          <form id="form-tarea">
            <div class="mb-3">
              <label for="input-nombre" class="form-label text-light-50">Nombre de la Tarea</label>
              <input type="text" class="form-control form-control-dark" id="input-nombre"
                placeholder="Ej. Sacar la basura">
            </div>
            <div class="mb-3">
              <label for="input-descripcion" class="form-label text-light-50">Descripción</label>
              <textarea class="form-control form-control-dark" id="input-descripcion" rows="3"
                placeholder="Detalles de la tarea..."></textarea>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="input-fecha" class="form-label text-light-50">Fecha de Entrega</label>
                <input type="date" class="form-control form-control-dark calendar-white" id="input-fecha">
              </div>
              <div class="col-md-6 mb-3">
                <label for="select-estado" class="form-label text-light-50">Estado</label>
                <select class="form-select form-control-dark" id="select-estado">
                  <option value="" selected disabled>Seleccionar estado</option>
                  <option value="PORHACER">Pendiente</option>
                  <option value="ENPROCESO">En proceso</option>
                  <option value="COMPLETADA">Completada</option>
                </select>
              </div>
            </div>
            <button type="submit" class="btn btn-primary-custom w-100 mt-2 fw-semibold py-2">Agregar Tarea</button>
          </form>
        </div>
      </div>

      <!-- Columna Derecha: Lista de Tarjetas -->
      <div class="col-lg-7 col-xl-8">
        <div id="contenedor-tareas" class="d-flex flex-column gap-3">
          <!-- Las tarjetas dinámicas se enlistan aquí -->
        </div>
      </div>

    </div>
  </div>

  <!-- Modal de Error -->
  <div class="modal fade text-dark" id="modalError" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-danger text-white">
          <h5 class="modal-title">Error en los datos</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="contenido-modal-error">
          <!-- Mensaje de validación -->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal de Éxito -->
  <div class="modal fade text-dark" id="modalExito" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title">¡Éxito!</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          Tarea registrada correctamente.
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-success" data-bs-dismiss="modal">Aceptar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/taskManager.js"></script>
  <script src="js/index.js"></script>
</body>

</html>
